<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Fuzz</title>
    <link rel="icon" type="image/png" href="img/icon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="cabecalho">
        <div class="logo">
            <img src="img/logo.png" alt="Logo do Fuzz" class="logo-texto">
        </div>

        <nav class="menu" aria-label="Menu principal">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="conteudo-principal contato-page">
        <section class="contato-box">
            <h1>Contato</h1>

            <form class="form-contato" id="formContato">
                <label>
                    Nome
                    <input type="text" name="nome">
                </label>

                <label>
                    Email
                    <input type="email" name="email">
                </label>

                <label>
                    Comentário
                    <textarea name="comentario" rows="5"></textarea>
                </label>

                <button type="submit" class="botao-enviar">Enviar</button>
            </form>
        </section>
    </main>

    <script>
        const form = document.getElementById('formContato');

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            form.reset();
            window.location.reload();
        });
    </script>
</body>

</html>
