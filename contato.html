<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Fuzz</title>
    <link rel="icon" type="image/png" href="img/icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="cabecalho">
        <div class="logo">
            <img src="img/logo.png" alt="Logo do Fuzz" class="logo-texto">
        </div>

        <nav class="menu" aria-label="Menu principal">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="container my-5 flex-grow-1">
        <section class="p-5 bg-white rounded-4 shadow-sm mx-auto" style="max-width: 700px;">
            <h1 class="mb-4 text-dark fw-bold">Contato</h1>

            <form id="formContato">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nome</label>
                    <input type="text" class="form-control p-3" name="nome">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" class="form-control p-3" name="email">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Comentário</label>
                    <textarea name="comentario" class="form-control p-3" rows="5"></textarea>
                </div>

                <button type="submit" class="btn btn-dark fw-bold px-4 py-2">Enviar</button>
            </form>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <p class="mb-0">© 2026 Fuzz. Todos os direitos reservados.</p>
    </footer>

    <script>
        const form = document.getElementById('formContato');

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            form.reset();
            window.location.reload();
        });
    </script>
</body>

</html>
